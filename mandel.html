<body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>

<div id="main">
	<div id="scrolltext"></div>
	<div id="screen"></div>
</div>

<script>

function createArray(length) {
    var arr = new Array(length || 0),
        i = length;

    if (arguments.length > 1) {
        var args = Array.prototype.slice.call(arguments, 1);
        while(i--) arr[length-1 - i] = createArray.apply(this, args);
    }

    return arr;
}

var LETTERS_X = 80;
var LETTERS_Y = 30;
var LETTER_WIDTH = 12;
var LETTER_HEIGHT = 20;
var MARGIN_X = 5;
var MARGIN_Y = 40;
var scroll_i = 0;
var x  = createArray(LETTERS_X, LETTERS_Y); // position x
var y  = createArray(LETTERS_X, LETTERS_Y); // position y
var dx = createArray(LETTERS_X, LETTERS_Y); // movement x
var dy = createArray(LETTERS_X, LETTERS_Y); // movement y
var r  = createArray(LETTERS_X, LETTERS_Y); // rotation
var dr = createArray(LETTERS_X, LETTERS_Y); // rotation speed
var text_i = 0;
var DELAY = 50;
var t = 0;
var RESET_TIMER = 120;
var DELAY_BEFORE_EXPLOSION = 30;
var FLASH_RATE = 21;

var MAND_ITER = 200;
var mand_min_x = [-2, -2, -0.54, -1.284, -0.807];
var mand_max_x = [ 1, .2,  0.26, -0.996, -0.707];
var mand_min_y = [-1, -1,  0.49, -0.376,  0.14575];
var mand_max_y = [ 1, .1,  1.09, -0.16,   0.22075];
var mand_i = 0;
var MAND_LETTERS = '.:;M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=M#8:;14:;DF;:jil;:op;:bn;:r4;:+0=';


var SCROLLTEXT = '                                   *** MANDELBROT EXPLOSION!!! ***                                Ravel and Chain Chomp present at Skrolli Party 2019                          *** Code by Ravel      *** Music by Chain Chomp                *** Greetings to NITA-TYTTÖ Windytan Viznut Hiiop Thihi Grendel Mikkohoo Jaffa tdb Grue Jope         and everyone at Skrolli Party!                         ';

// Add letter divs
function create_letters() {
	var letters_html = '';
	
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {
			letters_html += '<div class=\'letter\' id=\'letter_' + letter_x + '_' + letter_y + '\'></div>\n';
		}
		letters_html += '<br />\n';
	}

	$('#screen').html(letters_html);
}

// Plot a new Mandelbrot fractal
function draw_mandelbrot() {
	var min_x = mand_min_x[mand_i];
	var max_x = mand_max_x[mand_i];
	var min_y = mand_min_y[mand_i];
	var max_y = mand_max_y[mand_i];
	var mand_step_x = (max_x - min_x) / LETTERS_X;
	var mand_step_y = (max_y - min_y) / LETTERS_Y;
	
	// Process each letter
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {
		
			var color = checkIfBelongsToMandelbrotSet(min_x + letter_x * mand_step_x, min_y + letter_y * mand_step_y);
			var letter = MAND_LETTERS[Math.floor(color)];
			if (letter == undefined) { letter = MAND_LETTERS[0]; }
			$(letter_id(letter_x, letter_y)).html(letter);
			
		}
	}
	
	mand_i++;
	mand_i = mand_i % mand_min_x.length;
}

// Reset all letters to initial coordinates
function reset_letters() {
	
	// Process all letters
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {	
		
			// Position divs
			$(letter_id(letter_x, letter_y)).css('left', (MARGIN_X + letter_x * LETTER_WIDTH) + 'px');
			$(letter_id(letter_x, letter_y)).css('top', (MARGIN_Y + letter_y * LETTER_HEIGHT) + 'px');
			$(letter_id(letter_x, letter_y)).css('transform', 'rotate(0deg)');
			$(letter_id(letter_x, letter_y)).css('color', '#aaffa0');
			
			// Reset letter positions
			x[letter_x][letter_y] = 0;
			y[letter_x][letter_y] = 0;
			dx[letter_x][letter_y] = 0;
			dy[letter_x][letter_y] = 0;
			r[letter_x][letter_y] = 0;
			dr[letter_x][letter_y] = 0;
		}
	}
}

// Initialize a new explosion
function init_explosion() {

	// Get a new explosion
	var exp_x = Math.random() * LETTERS_X;
	var exp_y = Math.random() * LETTERS_Y;
	
	// Process all letters
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {	
		
			// Reset movement
			var d_temp = Math.sqrt(Math.pow(letter_x - exp_x, 2) + Math.pow(letter_y - exp_y, 2));
			dx[letter_x][letter_y] = -(exp_x - letter_x + Math.random() * 2 - 1) / d_temp * 10;
			dy[letter_x][letter_y] = -(exp_y - letter_y + Math.random() * 2 - 1) / d_temp * 10;
			
			// Reset rotation
			r[letter_x][letter_y] = 0;
			dr[letter_x][letter_y] = (Math.random() * 72 - 36) / d_temp;
			
			// Change color
			if (d_temp < 10 && d_temp >= 5) {
				$(letter_id(letter_x, letter_y)).css('color', '#f0ffa0');
			} else if (d_temp < 5) {
				$(letter_id(letter_x, letter_y)).css('color', 'white');
			}
			
		}
	}
}

// Return jquery handle for letter in position x, y
function letter_id(x, y) {
	return '#letter_' + x + '_' + y;
}

// Get a hexadecimal color representation for a letter
function get_color_string(letter_i) {
	var base = Math.floor(letter_i / N * 255);
	var total = 65536 * base + 256 * base //+ base
	return '#' + total.toString(16)
}

// Update letters once using scroll_i as offset
function update_letters() {
	
	// Process all letters
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {
		
			$(letter_id(letter_x, letter_y)).css('left', (MARGIN_X + x[letter_x][letter_y] + letter_x * LETTER_WIDTH) + 'px');
			$(letter_id(letter_x, letter_y)).css('top', (MARGIN_Y + y[letter_x][letter_y] + letter_y * LETTER_HEIGHT) + 'px');
			$(letter_id(letter_x, letter_y)).css('transform', 'rotate(' + r[letter_x][letter_y] + 'deg)');

		}
	}
}

// Calculate a point in Mandelbrot set
function checkIfBelongsToMandelbrotSet(x, y) {
    var realComponentOfResult = x;
    var imaginaryComponentOfResult = y;
    var maxIterations = MAND_ITER;
    for(var i = 0; i < maxIterations; i++) {
         var tempRealComponent = realComponentOfResult * realComponentOfResult
                                 - imaginaryComponentOfResult * imaginaryComponentOfResult
                                 + x;
         var tempImaginaryComponent = 2 * realComponentOfResult * imaginaryComponentOfResult
                                 + y;
         realComponentOfResult = tempRealComponent;
         imaginaryComponentOfResult = tempImaginaryComponent;

         // Return a number as a percentage
         if(realComponentOfResult * imaginaryComponentOfResult > 5) 
            return (i/maxIterations * 100);
    }
    return 0;   // Return zero if in set        
}      

// Sleep for a given time
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Update screen
function update_screen() {
	// Update scrolltext
	$('#scrolltext').html(SCROLLTEXT.substring(t % SCROLLTEXT.length, t % SCROLLTEXT.length + 50));
	var text_y = -20 + Math.floor(20 * Math.sin(t / 2));
	$('#scrolltext').css('top', text_y + 'px');
	
	if (t % RESET_TIMER == 0) { 
		reset_letters();  // Reset everything to initial positions
		draw_mandelbrot(); // Plot a new Mandelbrot fractal
	}
	if (t % RESET_TIMER == DELAY_BEFORE_EXPLOSION) { 
		init_explosion(); // Start a new explosion
	}

	// Move everything
	var bgcolor = 'none';
	if (t % FLASH_RATE == 10) { bgcolor = '#a00000'; } else { bgcolor = 'black'; }
	for (var letter_y = 0; letter_y < LETTERS_Y; letter_y++) {
		for (var letter_x = 0; letter_x < LETTERS_X; letter_x++) {
			x[letter_x][letter_y] += dx[letter_x][letter_y]
			y[letter_x][letter_y] += dy[letter_x][letter_y]
			r[letter_x][letter_y] += dr[letter_x][letter_y]
			$(letter_id(letter_x, letter_y)).css('background-color', bgcolor); // Flash
		}
	}
	update_letters();

	t++;
}

// Document ready, start demo
$(document).ready(function() {
    create_letters();
	setInterval(update_screen, DELAY);
});


</script>
